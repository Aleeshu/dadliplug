name: Flutter CI

# Only paths that touch the Flutter app. Docs and ops changes should not spend
# CI minutes on a build they cannot affect.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # The Firebase config is gitignored; CI gets it from a repository
      # secret. The build fails without it (com.google.gms.google-services).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      # Debug build only. Release builds need a keystore and are done
      # deliberately, not on every push.
      - run: flutter build apk --debug

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # CocoaPods, not Swift Package Manager. SPM resolves the whole
      # firebase-ios-sdk package, whose 13.x needs gtm-session-fetcher >= 4,
      # while GoogleSignIn 9.x needs < 4: no solution. CocoaPods resolves only
      # the pods used (FirebaseMessaging), which do not conflict.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      # No codesign. Confirms the iOS build compiles; signing needs the Apple
      # Developer account (docs/ios-release.md).
      - run: flutter build ios --debug --no-codesign

  # iOS builds only on macOS runners. This job exists to fail loudly on a Mac
  # rather than let a signing or CocoaPods problem reach the store.
  web-check:
    name: Dart VM sanity
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart analyze --fatal-infos