name: Flutter CI

# Only paths that touch the Flutter app. Docs and ops changes should not spend
# CI minutes on a build they cannot affect.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # Debug build only. Release builds need a keystore and are done
      # deliberately, not on every push.
      - run: flutter build apk --debug

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # No codesign. Confirms the iOS build compiles; signing needs the Apple
      # team credentials, which are still undecided in the plan.
      - run: flutter build ios --debug --no-codesign

  # iOS builds only on macOS runners. This job exists to fail loudly on a Mac
  # rather than let a signing or CocoaPods problem reach the store.
  web-check:
    name: Dart VM sanity
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart analyze --fatal-infos